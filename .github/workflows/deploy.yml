name: Production CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. TEST & VERIFICATION STAGE
  # ==========================================
  verify:
    name: Build & Verify Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify Backend Build
        run: |
          cd backend
          npm install
          npm run build

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm install
          npm run build

  # ==========================================
  # 2. AUTOMATED ZERO-DOWNTIME DEPLOYMENT
  # ==========================================
  deploy:
    name: Deploy to Production Server (shtca.com)
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment for shtca.com..."
            
            TARGET_DIR="${{ secrets.WORK_DIR || '/opt/shtca' }}"
            
            # Agar git repo exist nahi karti to clean clone karein (existing .env preserve karke)
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "📦 Git repository not found in $TARGET_DIR. Cloning fresh repository..."
              TEMP_ENV_BACKUP=$(mktemp -d)
              
              if [ -d "$TARGET_DIR" ]; then
                echo "Backing up existing environment files..."
                cp -r "$TARGET_DIR"/.env* "$TEMP_ENV_BACKUP"/ 2>/dev/null || true
                rm -rf "$TARGET_DIR"
              fi
              
              git clone "https://github.com/${{ github.repository }}.git" "$TARGET_DIR"
              
              # Restore environment files
              cp -r "$TEMP_ENV_BACKUP"/.env* "$TARGET_DIR"/ 2>/dev/null || true
              rm -rf "$TEMP_ENV_BACKUP"
            fi

            cd "$TARGET_DIR"
            git config --global --add safe.directory "$TARGET_DIR"

            # Pull latest changes from main branch
            echo "📥 Syncing latest release from main branch..."
            git remote set-url origin "https://github.com/${{ github.repository }}.git"
            git fetch origin main
            git reset --hard origin/main

            # Ensure .env.production exists (fallback from example if first deploy)
            if [ ! -f .env.production ] && [ ! -f .env ]; then
              echo "⚠️ No .env.production found, creating from .env.production.example"
              cp .env.production.example .env.production
            fi

            # Build and deploy Docker containers
            echo "🐳 Building and spinning up containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # Clean up old unused docker layers to save disk space
            docker image prune -f

            # Verify services are healthy
            docker compose -f docker-compose.prod.yml ps

            echo "✅ Deployment completed successfully for shtca.com & api.shtca.com!"

