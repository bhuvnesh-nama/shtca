name: Production CI/CD Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. TEST & VERIFICATION STAGE
  # ==========================================
  verify:
    name: Build & Verify Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify Backend Build
        run: |
          cd backend
          npm install
          npm run build

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm install
          npm run build

  # ==========================================
  # 2. AUTOMATED ZERO-DOWNTIME DEPLOYMENT
  # ==========================================
  deploy:
    name: Deploy to Production Server (shtca.com)
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment for shtca.com..."
            
            TARGET_DIR="${{ secrets.WORK_DIR || '/opt/shtca' }}"
            
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            git config --global --add safe.directory "$TARGET_DIR"

            # Sync latest release from main branch
            if [ -d .git ]; then
              echo "📥 Syncing latest release from main branch..."
              git remote set-url origin "https://github.com/${{ github.repository }}.git"
              git fetch origin main
              git reset --hard origin/main
            else
              echo "📦 Initializing repository in $TARGET_DIR..."
              git init -b main
              git remote add origin "https://github.com/${{ github.repository }}.git"
              git fetch origin main
              git reset --hard origin/main
              git branch --set-upstream-to=origin/main main
            fi

            # Ensure .env.production exists (fallback from example if first deploy)
            if [ ! -f .env.production ] && [ ! -f .env ]; then
              echo "⚠️ No .env.production found, creating from .env.production.example"
              cp .env.production.example .env.production
            fi

            ENV_FILE=".env.production"
            if [ ! -f "$ENV_FILE" ]; then
              ENV_FILE=".env"
            fi

            # Build and deploy Docker containers
            echo "🐳 Building and spinning up containers..."
            docker compose --env-file "$ENV_FILE" -f docker-compose.prod.yml up -d --build --remove-orphans

            # Clean up old unused docker layers to save disk space
            docker image prune -f

            # Verify services are healthy
            docker compose -f docker-compose.prod.yml ps

            echo "✅ Deployment completed successfully for shtca.com & api.shtca.com!"

