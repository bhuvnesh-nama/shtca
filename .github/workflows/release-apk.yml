name: Build & Publish Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name || 'v1.0.0' }}
          name: SHTCA Mobile App ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name || 'v1.0.0' }}
          body: |
            ## 📱 SHTCA Citizen Mobile App (Android)

            Official Android application for the **SHTCA (Smart Hyperlocal Town & Civic Authority)** portal.
            
            ### ✨ Highlights in this Release:
            - **Live GPS Auto-Routing**: Automatically detects citizen location and routes grievances to the nearest municipal authority desk.
            - **No Manual Zone Selection**: Ward and zone dropdowns eliminated; replaced with actual street addresses and verified landmarks.
            - **Interactive Leaflet & OSM Civic Map**: Real-time nearby grievance tracking with color-coded severity markers.
            - **Emergency Civic Broadcasts**: Direct citizen alerts for water, electricity, and sanitation advisories.
            - **100% Citizen-Focused**: Streamlined UI dedicated exclusively to residents (officer admin console is web-only).

            ### 📦 Download & Installation:
            1. Download `app-release.apk` attached below.
            2. Open the `.apk` on your Android phone and install.
          draft: false
          prerelease: false
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

